services:
  db:
    restart: unless-stopped
    image: postgres:16
    environment:
      POSTGRES_DB: edgeflow
      POSTGRES_USER: edgeflow
      POSTGRES_PASSWORD: avppVVR4NcnSagQzqa-LIDCZNjacTbz6
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgeflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    restart: unless-stopped
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://edgeflow:avppVVR4NcnSagQzqa-LIDCZNjacTbz6@db:5432/edgeflow
      # Auth — LEGACY_MODE stays on so anonymous browsing still resolves
      # to the legacy admin. With the middleware now JWT-preferred, a
      # signed-in user gets routed by their token while the LEGACY_MODE
      # default catches everyone else. DEV_TOKEN_ENABLED + an HS256 secret
      # let you log in via the /login page in development.
      LEGACY_MODE: "true"
      DEV_TOKEN_ENABLED: "true"
      JWT_HS256_SECRET: "vela-dev-secret-rotate-before-production"
      JWT_ISSUER: "vela-dev"
      # Persist the HuggingFace/FinBERT cache (see volume below) so the ~500MB
      # model isn't re-downloaded on every container restart — a cold load can
      # push the first research/news call past the proxy timeout.
      HF_HOME: /root/.cache/huggingface
      # Momentum Radar backups: POST /api/radar/housekeeping runs housekeeping in
      # this container, so it shares the radar worker's backup volume.
      RADAR_BACKUP_DIR: /backups/radar
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - hf_cache:/root/.cache/huggingface
      - radar_backups:/backups/radar

  # Momentum Radar worker (backend/radar/worker.py): scans every 5 minutes in the
  # NYSE session, nightly housekeeping, Discord entry alerts. Same image as the
  # backend; a separate container so a tick's blocking HTTP/numpy work never
  # stalls the API. Single instance via a Postgres advisory lock; the backend
  # container runs the migrations, the worker waits for the radar tables.
  radar:
    restart: unless-stopped
    build: ./backend
    command: ["python", "-m", "radar.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://edgeflow:avppVVR4NcnSagQzqa-LIDCZNjacTbz6@db:5432/edgeflow
      RADAR_BACKUP_DIR: /backups/radar
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - radar_backups:/backups/radar
    mem_limit: 700m

  frontend:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  hf_cache:
  radar_backups:

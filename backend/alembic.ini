# Alembic config for Vela / EdgeFlow.
#
# The actual sqlalchemy.url is set in env.py from settings.DATABASE_URL,
# so the placeholder here is intentional — alembic CLI commands work
# without env vars because env.py overrides this value.
[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql://placeholder

[post_write_hooks]
# (none) — could plug in `black` here if we want auto-formatting on
# newly-generated migrations later.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

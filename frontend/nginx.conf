server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # On-demand research/analysis is synchronous and can run 30-120s
        # (cold FinBERT load after a restart, heavy news/options tickers).
        # Raise the proxy timeouts above nginx's 60s default so the browser
        # receives the result instead of a 504 surfacing as "Analysis failed".
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

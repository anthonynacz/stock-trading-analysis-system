server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    location /api {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # On-demand research/analysis is synchronous and can run 30-120s
        # (cold FinBERT load after a restart, heavy news/options tickers).
        # Raise the proxy timeouts above nginx's 60s default so the browser
        # receives the result instead of a 504 surfacing as "Analysis failed".
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Vite hashes every file under /assets/, so they can be cached forever;
    # no try_files here so a missing asset 404s instead of returning index.html.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html must revalidate on every load so a deploy picks up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
